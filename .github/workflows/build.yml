name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: libdxtcompress.dll
            cmd: cl /O2 /EHsc /LD /Fe:libdxtcompress.dll dxt_compress.c bc7_wrapper.cpp bc7enc/bc7enc.cpp bc7enc/bc7decomp.cpp
          - os: ubuntu-latest
            artifact: libdxtcompress.so
            cmd: gcc -O3 -fPIC -c dxt_compress.c -o dxt_compress.o && g++ -O3 -fPIC -std=c++14 -c bc7_wrapper.cpp bc7enc/bc7enc.cpp bc7enc/bc7decomp.cpp && g++ -shared -o libdxtcompress.so dxt_compress.o bc7_wrapper.o bc7enc.o bc7decomp.o -lm
          - os: macos-latest
            artifact: libdxtcompress.dylib
            cmd: clang -O3 -fPIC -c dxt_compress.c -o dxt_compress.o && clang++ -O3 -fPIC -std=c++14 -c bc7_wrapper.cpp bc7enc/bc7enc.cpp bc7enc/bc7decomp.cpp && clang++ -dynamiclib -o libdxtcompress.dylib dxt_compress.o bc7_wrapper.o bc7enc.o bc7decomp.o -lm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build main library (libdxtcompress)
        working-directory: shared
        shell: bash
        run: ${{ matrix.cmd }}

      - name: Upload main library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: shared/${{ matrix.artifact }}

      # --- Windows-only: optional GPU BC7 accelerator (DirectXTex / DirectCompute) ---
      - name: Install DirectXTex (vcpkg)
        if: runner.os == 'Windows'
        shell: cmd
        run: vcpkg install directxtex:x64-windows

      - name: Build Bc7Native.dll (Windows GPU BC7)
        if: runner.os == 'Windows'
        working-directory: shared
        shell: cmd
        # /MD is required: vcpkg's DirectXTex (x64-windows) uses the dynamic CRT,
        # and cl defaults to /MT — a mismatch causes LNK2038. ole32 resolves the
        # WIC factory pulled in by DirectXTexUtil.
        run: cl /O2 /MD /EHsc /LD /I"%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\include" Bc7Native.cpp /Fe:Bc7Native.dll /link "%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\lib\DirectXTex.lib" d3d11.lib dxgi.lib ole32.lib uuid.lib

      - name: Upload Bc7Native.dll
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Bc7Native.dll
          path: shared/Bc7Native.dll

  release:
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Copy DLLs for installer
        shell: bash
        run: |
          cp artifacts/libdxtcompress.dll/libdxtcompress.dll shared/libdxtcompress.dll
          cp artifacts/Bc7Native.dll/Bc7Native.dll shared/Bc7Native.dll

      - name: Build installer
        shell: cmd
        run: iscc installer\GIMP_TEX_Plugin_Setup.iss

      - name: Build release zips
        shell: bash
        run: |
          # GIMP 3 - Windows (incl. optional GPU BC7 accelerator Bc7Native.dll)
          mkdir -p gimp3_win
          cp gimp3/gimp3_tex_plugin.py shared/tex_core.py shared/dxt_compress.py artifacts/libdxtcompress.dll/libdxtcompress.dll artifacts/Bc7Native.dll/Bc7Native.dll gimp3_win/
          powershell Compress-Archive -Path 'gimp3_win/*' -DestinationPath GIMP3_TEX_Plugin_Windows.zip

          # GIMP 3 - macOS
          mkdir -p gimp3_mac
          cp gimp3/gimp3_tex_plugin.py shared/tex_core.py shared/dxt_compress.py artifacts/libdxtcompress.dylib/libdxtcompress.dylib gimp3_mac/
          chmod +x gimp3_mac/gimp3_tex_plugin.py
          tar -czf GIMP3_TEX_Plugin_macOS.tar.gz -C gimp3_mac .

          # GIMP 3 - Linux
          mkdir -p gimp3_linux
          cp gimp3/gimp3_tex_plugin.py shared/tex_core.py shared/dxt_compress.py artifacts/libdxtcompress.so/libdxtcompress.so gimp3_linux/
          chmod +x gimp3_linux/gimp3_tex_plugin.py
          tar -czf GIMP3_TEX_Plugin_Linux.tar.gz -C gimp3_linux .

          # GIMP 2 - Windows (incl. optional GPU BC7 accelerator Bc7Native.dll)
          mkdir -p gimp2_win/gimp2_tex_libs
          cp gimp2/gimp2_tex_plugin.py gimp2_win/
          cp shared/tex_core.py shared/dxt_compress.py artifacts/libdxtcompress.dll/libdxtcompress.dll artifacts/Bc7Native.dll/Bc7Native.dll gimp2_win/gimp2_tex_libs/
          powershell Compress-Archive -Path 'gimp2_win/*' -DestinationPath GIMP2_TEX_Plugin_Windows.zip

          # GIMP 2 - macOS
          mkdir -p gimp2_mac/gimp2_tex_libs
          cp gimp2/gimp2_tex_plugin.py gimp2_mac/
          chmod +x gimp2_mac/gimp2_tex_plugin.py
          cp shared/tex_core.py shared/dxt_compress.py artifacts/libdxtcompress.dylib/libdxtcompress.dylib gimp2_mac/gimp2_tex_libs/
          tar -czf GIMP2_TEX_Plugin_macOS.tar.gz -C gimp2_mac .

          # GIMP 2 - Linux
          mkdir -p gimp2_linux/gimp2_tex_libs
          cp gimp2/gimp2_tex_plugin.py gimp2_linux/
          chmod +x gimp2_linux/gimp2_tex_plugin.py
          cp shared/tex_core.py shared/dxt_compress.py artifacts/libdxtcompress.so/libdxtcompress.so gimp2_linux/gimp2_tex_libs/
          tar -czf GIMP2_TEX_Plugin_Linux.tar.gz -C gimp2_linux .

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/GIMP_TEX_Plugin_Setup.exe
            GIMP3_TEX_Plugin_Windows.zip
            GIMP3_TEX_Plugin_macOS.tar.gz
            GIMP3_TEX_Plugin_Linux.tar.gz
            GIMP2_TEX_Plugin_Windows.zip
            GIMP2_TEX_Plugin_macOS.tar.gz
            GIMP2_TEX_Plugin_Linux.tar.gz
